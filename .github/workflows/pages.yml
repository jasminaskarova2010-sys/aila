# Сайт с Айлой: при каждой загрузке кода GitHub собирает приложение для браузера
# и выкладывает его на https://jasminaskarova2010-sys.github.io/aila/
# Контакты поддержки сюда не попадают: support_contacts.json есть только на Mac владелицы.
name: Сайт

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /aila/ --no-wasm-dry-run
      # Метка версии в ссылках на файлы приложения: после обновления телефон
      # сразу берёт новую версию, а не старую копию из памяти браузера.
      - run: |
          V="${GITHUB_SHA::8}"
          sed -i "s/\"main.dart.js\"/\"main.dart.js?v=$V\"/g" build/web/flutter_bootstrap.js
          sed -i "s/flutter_bootstrap.js\"/flutter_bootstrap.js?v=$V\"/" build/web/index.html
          grep -c "main.dart.js?v=$V" build/web/flutter_bootstrap.js
          grep -c "flutter_bootstrap.js?v=$V" build/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
